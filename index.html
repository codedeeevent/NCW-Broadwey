<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>นิทรรศการฮีลใจ ศรัทธาสุดท้าย</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* =========================================
           1. ตั้งค่าพื้นฐาน (Mobile Optimized)
           ========================================= */
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4eae4;
            /* เพิ่ม Gradient บางๆ ทับรูป เพื่อให้ตัวหนังสือเด่นขึ้นบนมือถือ */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(230, 200, 190, 0.6)), url('bg2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #4a3b32; 
            min-height: 100svh; /* ใช้ svh สำหรับมือถือ (แก้ปัญหาแถบ URL บัง) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            overscroll-behavior: none; /* กันการดึงหน้าจอรีเฟรชบนมือถือ */
        }

        /* =========================================
           2. ด้ายแดงแห่งโชคชะตา (มีชีวิต & เรืองแสง)
           ========================================= */
        .red-thread-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .red-thread-bg path {
            fill: none;
            stroke: #d63031;
            stroke-width: 3;
            stroke-linecap: round;
            /* ทำให้เส้นเรืองแสง */
            filter: drop-shadow(0 0 12px rgba(214, 48, 49, 0.8));
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            animation: drawThread 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       pulseThread 3s ease-in-out 3.5s infinite alternate;
        }
        .red-thread-bg path:nth-child(2) {
            animation-delay: 1s, 4.5s; /* หน่วงเวลาเส้นที่สอง */
            stroke-width: 2;
            filter: drop-shadow(0 0 8px rgba(214, 48, 49, 0.5));
        }

        @keyframes drawThread { to { stroke-dashoffset: 0; } }
        /* จังหวะเต้นของเส้นด้าย (Heartbeat Glow) */
        @keyframes pulseThread {
            0% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(214, 48, 49, 0.4)); }
            100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(214, 48, 49, 1)); }
        }

        /* =========================================
           3. กล่องฟอร์ม (Premium Glassmorphism & Cinematic Intro)
           ========================================= */
        .container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.65) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px 25px;
            border-radius: 24px;
            /* เงาสะท้อนขอบกระจกด้านใน และเงาสีแดงด้านนอก */
            box-shadow: 0 20px 50px rgba(138, 3, 3, 0.2), 
                        inset 0 0 0 1.5px rgba(255, 255, 255, 0.9),
                        inset 0 20px 20px rgba(255, 255, 255, 0.5);
            width: 92%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            
            /* Cinematic Reveal Animation */
            opacity: 0;
            transform: scale(1.1) translateY(30px);
            filter: blur(10px);
            animation: grandReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes grandReveal {
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* หัวข้อ */
        h1 {
            text-align: center;
            background: linear-gradient(to right, #8a0303, #d63031, #8a0303);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 5px 0;
            font-weight: 700;
            font-size: 2em;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(214, 48, 49, 0.2); /* เรืองแสงเบาๆ */
        }
        .subtitle {
            text-align: center;
            color: #b33939;
            font-size: 0.95em;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* =========================================
           4. รูปโปรไฟล์มีออร่า (Glowing Aura)
           ========================================= */
        .profile-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }
        .profile-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #d63031, #ff9999, #d63031);
            z-index: -1;
            filter: blur(10px);
            animation: spinGlow 4s linear infinite;
        }
        .profile-image {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid #fff;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }
        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #displayName {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.15em;
            font-weight: 600;
            color: #5c0f0f;
        }

        /* =========================================
           5. ฟอร์มกรอกข้อมูล (สวยหรู ทัชง่าย)
           ========================================= */
        label {
            display: block;
            margin-bottom: 6px;
            color: #8a7366;
            font-weight: 600;
            font-size: 0.9em;
            transform: translateX(5px); /* ขยับนิดนึงให้ดูมีดีไซน์ */
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: none;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 2px 0 rgba(255,255,255,0.8);
            color: #4a3b32;
            font-family: 'Kanit', sans-serif;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus, select:focus {
            outline: none;
            background-color: #fff;
            transform: translateY(-2px); /* ลอยขึ้นตอนพิมพ์ */
            box-shadow: 0 10px 20px rgba(214, 48, 49, 0.15), inset 0 0 0 2px #d63031;
        }

        /* =========================================
           6. ปุ่มกดเต้นตุบๆ (Heartbeat Button)
           ========================================= */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d63031 0%, #8a0303 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1.5px;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(214, 48, 49, 0.4);
            position: relative;
            overflow: hidden;
            /* อนิเมชันปุ่มเต้น */
            animation: heartbeatBtn 2s infinite;
        }
        /* เอฟเฟกต์แสงวิ่งพาดปุ่ม */
        button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }
        @keyframes heartbeatBtn {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.02); box-shadow: 0 10px 30px rgba(214, 48, 49, 0.6); }
            20% { transform: scale(1); }
        }
        @keyframes shine {
            0% { left: -100%; }
            20%, 100% { left: 200%; }
        }

        /* =========================================
           7. เอฟเฟกต์ 3D ลอยพริ้ว (ละออง & กลีบดอกไม้)
           ========================================= */
        #effect-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .particle {
            position: absolute;
            opacity: 0;
            /* ใช้ translate3d ช่วยให้มือถือประมวลผลลื่นขึ้น */
            will-change: transform, opacity;
            animation: floatUp 8s ease-in infinite, sway 3s ease-in-out infinite alternate;
        }
        /* แสงละอองอุ่นๆ */
        .particle.orb {
            background: radial-gradient(circle, #fff, rgba(255,220,200,0));
            border-radius: 50%;
        }
        /* หัวใจเล็กๆ / กลีบกุหลาบ */
        .particle.petal {
            color: rgba(214, 48, 49, 0.7);
            font-size: 14px;
            filter: drop-shadow(0 2px 4px rgba(214,48,49,0.3));
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0.5); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.2); }
        }
        @keyframes sway {
            0% { transform: translateX(-20px) rotate(-15deg); }
            100% { transform: translateX(20px) rotate(15deg); }
        }

    </style>
</head>
<body>

    <!-- พื้นหลังด้ายแดงขยับได้ -->
    <svg class="red-thread-bg" preserveAspectRatio="none" viewBox="0 0 100 100">
        <path d="M-10,30 C20,90 80,10 110,70" />
        <path d="M-10,70 C30,-10 70,110 110,20" />
    </svg>

    <!-- คอนเทนเนอร์ใส่เอฟเฟกต์ลอยๆ -->
    <div id="effect-container"></div>
    
    <div class="container">
        <form id="eventForm" onsubmit="submitForm(); return false;">
            <h1>ศรัทธาสุดท้าย</h1>
            <div class="subtitle">ความรัก...ที่ผูกด้วยศรัทธา</div>
            
            <!-- ครอบรูปโปรไฟล์เพื่อทำแสงออร่า -->
            <div class="profile-wrapper">
                <img id="profileImageDisplay" src="" alt="Profile Image" class="profile-image">
            </div>
            
            <span id="displayName"></span>

            <label for="fullName">ชื่อ-นามสกุล:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="ระบุชื่อ-นามสกุล"><br>

            <label for="phoneNumber">เบอร์โทร:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="0xxxxxxxxx"><br>

            <label for="exhibition">เลือกนิทรรศการ:</label>
            <select id="exhibition" name="exhibition" required>
                <option value="" disabled selected>กรุณาเลือกนิทรรศการ</option>
            </select><br>

            <label for="visitDate">เลือกวันที่เข้าชม:</label>
            <select id="visitDate" name="visitDate" required>
                <option value="" disabled selected>เลือกวันที่เข้าชม</option>
            </select><br>

            <label for="visitTime">เลือกรอบการเข้าชม:</label>
            <select id="visitTime" name="visitTime" required>
                <option value="" disabled selected>กรุณาเลือกรอบการเข้าชม</option>
            </select><br>

            <input type="hidden" id="userid" name="userid">
            <input type="hidden" id="displayname" name="displayname">
            <input type="hidden" id="profileimage" name="profileimage">

            <button type="submit">ลงทะเบียน</button>
        </form>
    </div>
  
    <script>
        // ฟังก์ชันสร้างเอฟเฟกต์อลังการ (ลื่นไหลบนมือถือ)
        function createParticles() {
            const container = document.getElementById('effect-container');
            
            // สร้างละอองแสง (Orbs)
            for (let i = 0; i < 15; i++) {
                let orb = document.createElement('div');
                orb.className = 'particle orb';
                let size = Math.random() * 6 + 2; 
                orb.style.width = `${size}px`;
                orb.style.height = `${size}px`;
                orb.style.left = `${Math.random() * 100}vw`;
                
                // สุ่มระยะเวลาให้ลอยไม่พร้อมกัน
                let duration = Math.random() * 6 + 6;
                let delay = Math.random() * 5;
                orb.style.animation = `floatUp ${duration}s ${delay}s linear infinite, sway ${Math.random()*3+2}s ease-in-out infinite alternate`;
                container.appendChild(orb);
            }

            // สร้างกลีบดอกไม้/หัวใจ (Petals)
            for (let i = 0; i < 10; i++) {
                let petal = document.createElement('div');
                petal.className = 'particle petal';
                petal.innerHTML = '❤'; // หรือใช้สัญลักษณ์กลีบดอกไม้
                
                let size = Math.random() * 12 + 10; 
                petal.style.fontSize = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                
                let duration = Math.random() * 7 + 7;
                let delay = Math.random() * 5;
                // กลีบดอกไม้จะส่ายกว้างกว่าละอองแสง
                petal.style.animation = `floatUp ${duration}s ${delay}s ease-in infinite, sway ${Math.random()*2+2}s ease-in-out infinite alternate-reverse`;
                container.appendChild(petal);
            }
        }
        
        window.addEventListener('load', createParticles);
    </script>
</body>
</html>
