<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นิทรรศการฮีลใจ ศรัทธาสุดท้าย</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ตั้งค่าพื้นฐานใหม่ และเรียกใช้รูปพื้นหลัง bg2.jpeg */
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('bg2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #4a3b32; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* --- เอฟเฟกต์ด้ายแดงพื้นหลัง (SVG) --- */
        .red-thread-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .red-thread-bg path {
            fill: none;
            stroke: #d63031;
            stroke-width: 2.5;
            opacity: 0.6;
            filter: drop-shadow(0 0 5px rgba(214, 48, 49, 0.4));
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawThread 4s ease-out forwards;
        }
        /* เส้นที่สองให้วาดช้ากว่านิดนึง */
        .red-thread-bg path:nth-child(2) {
            animation-delay: 1s;
        }

        @keyframes drawThread {
            to { stroke-dashoffset: 0; }
        }

        /* --- กล่องฟอร์ม (กระจกฝ้าโปร่งแสง) --- */
        .container {
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(184, 45, 45, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            width: 90%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: softFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        /* เส้นด้ายแดงตกแต่งด้านบนกล่อง */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: #d63031;
            border-radius: 0 0 10px 10px;
        }

        @keyframes softFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #5c0f0f; 
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 1.8em;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #d63031;
            font-size: 0.9em;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .profile-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 15px auto;
            border: 3px solid #fff;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3); /* เปลี่ยนเงารูปโปรไฟล์ให้มีกลิ่นอายสีแดง */
        }

        #displayName {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 500;
            color: #5c0f0f;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #6d544a;
            font-weight: 500;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 18px;
            border: 1.5px solid #e2d1c8;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.7); 
            color: #4a3b32;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d63031;
            box-shadow: 0 0 0 3px rgba(214, 48, 49, 0.15);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(192, 57, 43, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 57, 43, 0.4);
            background: linear-gradient(135deg, #f15a4a 0%, #d14233 100%);
        }

        /* เอฟเฟกต์แสงละอองอบอุ่น และ หัวใจ */
        #effect-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* ให้อยู่เหนือเส้นด้าย แต่อยู่ใต้ฟอร์ม */
            pointer-events: none;
        }

        .mote {
            position: absolute;
            background-color: rgba(255, 230, 200, 0.6);
            border-radius: 50%;
            filter: blur(1px);
            animation: float linear infinite;
        }

        .floating-heart {
            position: absolute;
            color: #d63031;
            font-size: 16px;
            opacity: 0;
            text-shadow: 0 0 8px rgba(214, 48, 49, 0.5);
            animation: floatHeart linear infinite;
        }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        @keyframes floatHeart {
            0% { opacity: 0; transform: translateY(10vh) scale(0.5) rotate(-15deg); }
            50% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.1) rotate(15deg); }
        }

        @media (max-width: 480px) {
            .container {
                width: 85%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- เอฟเฟกต์เส้นด้ายแดงไขว้กันด้านหลัง (ด้ายแห่งโชคชะตา) -->
    <svg class="red-thread-bg" preserveAspectRatio="none" viewBox="0 0 100 100">
        <!-- เส้นที่ 1 -->
        <path d="M-10,20 C30,80 70,-10 110,60" />
        <!-- เส้นที่ 2 -->
        <path d="M-10,80 C40,10 60,110 110,30" />
    </svg>

    <!-- เอฟเฟกต์ละอองแสง และ หัวใจลอย -->
    <div id="effect-container"></div>
    
    <div class="container">
        <form id="eventForm" onsubmit="submitForm(); return false;">
            <!-- Header ให้ตรงกับโปสเตอร์ -->
            <h1>ศรัทธาสุดท้าย</h1>
            <div class="subtitle">นิทรรศการฮีลใจ</div>
            
            <img id="profileImageDisplay" src="" alt="Profile Image" class="profile-image"><br>
            
            <span id="displayName"></span><br>

            <label for="fullName">ชื่อ-นามสกุล:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="ระบุชื่อ-นามสกุล"><br>

            <label for="phoneNumber">เบอร์โทร:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="0xxxxxxxxx"><br>

            <label for="exhibition">เลือกนิทรรศการ:</label>
            <select id="exhibition" name="exhibition" required>
                <option value="" disabled selected>กรุณาเลือกนิทรรศการ</option>
            </select><br>

            <label for="visitDate">เลือกวันที่เข้าชม:</label>
            <select id="visitDate" name="visitDate" required>
                <option value="" disabled selected>เลือกวันที่เข้าชม</option>
            </select><br>

            <label for="visitTime">เลือกรอบการเข้าชม:</label>
            <select id="visitTime" name="visitTime" required>
                <option value="" disabled selected>กรุณาเลือกรอบการเข้าชม</option>
            </select><br>

            <input type="hidden" id="userid" name="userid">
            <input type="hidden" id="displayname" name="displayname">
            <input type="hidden" id="profileimage" name="profileimage">

            <button type="submit">ลงทะเบียน</button>
        </form>
    </div>
  
    <script>
        // ฟังก์ชันสร้างละอองแสง (Dust Motes) และ หัวใจ (Hearts) ฮีลใจ
        function createEffects() {
            const container = document.getElementById('effect-container');
            
            // สร้างละอองแสง
            const moteCount = 20; 
            for (let i = 0; i < moteCount; i++) {
                const mote = document.createElement('div');
                mote.classList.add('mote');
                const size = Math.random() * 4 + 2; 
                mote.style.width = `${size}px`;
                mote.style.height = `${size}px`;
                mote.style.left = `${Math.random() * 100}vw`;
                mote.style.top = `${Math.random() * 100}vh`;
                mote.style.animationDuration = `${Math.random() * 4 + 4}s`; 
                mote.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(mote);
            }

            // สร้างหัวใจลอย
            const heartCount = 10; // จำนวนหัวใจ ไม่ต้องเยอะมากจะได้ดูละมุน
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤'; // ใส่ไอคอนหัวใจ
                
                // สุ่มขนาดให้เล็กใหญ่ต่างกัน
                const size = Math.random() * 10 + 10; 
                heart.style.fontSize = `${size}px`;
                
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.top = `${Math.random() * 100}vh`;
                heart.style.animationDuration = `${Math.random() * 5 + 6}s`; // ลอยช้าๆ 6-11 วิ
                heart.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(heart);
            }
        }
        
        window.addEventListener('load', createEffects);
    </script>
</body>
</html>
