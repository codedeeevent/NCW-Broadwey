<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ticket | นิทรรศการฮีลใจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script หลัก -->
    <script src="eticket.js"></script>

    <style>
        /* --- ตั้งค่าพื้นฐาน (ธีมฮีลใจ bg2.jpeg) --- */
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            
            /* พื้นหลังรูปภาพ */
            background-image: url('bg2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: #4a3b32; /* สีข้อความหลักน้ำตาลเข้ม */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- เอฟเฟกต์แสงละอองอุ่น (แทนดาว) --- */
        #stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .mote {
            position: absolute;
            background-color: rgba(255, 230, 200, 0.6);
            border-radius: 50%;
            filter: blur(1px);
            animation: float linear infinite;
        }
        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        /* --- กล่องตั๋ว (กระจกฝ้าโปร่งแสง) --- */
        .container {
            background-color: rgba(255, 255, 255, 0.85); /* สีขาวโปร่งแสง */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px 30px 30px;
            border-radius: 20px;
            
            /* เงาสีแดงอ่อนๆ และขอบขาว */
            box-shadow: 0 15px 35px rgba(184, 45, 45, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.8);
            
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
            z-index: 10;
            
            /* Animation ลอยขึ้นมานุ่มนวล */
            opacity: 0;
            transform: translateY(20px);
            animation: softFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        /* เส้นด้ายแดงตกแต่งด้านบนตั๋ว */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: #d63031;
            border-radius: 0 0 10px 10px;
        }

        @keyframes softFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* หัวข้อบัตร */
        h1 {
            color: #5c0f0f;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        
        .subtitle {
            color: #d63031;
            font-size: 1em;
            margin-bottom: 25px;
            font-weight: 500;
            border-bottom: 2px dashed #e2d1c8; /* เส้นประเหมือนรอยฉีกตั๋ว */
            padding-bottom: 20px;
        }

        /* --- ส่วน QR Code --- */
        .qr-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #fff; 
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); /* เงาบางๆ ให้ QR Code ลอยขึ้นมา */
            border: 1px solid #f0e6e1;
        }

        #qrcode {
            display: block;
        }

        /* Overlay หมดอายุ (ปรับให้น่ารักขึ้น เหมือนตราปั๊ม) */
        .expired-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.85); /* พื้นหลังขาวฝ้า */
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            z-index: 20;
            backdrop-filter: blur(2px);
        }

        .expired-text {
            color: #d63031;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #d63031;
            border-radius: 8px;
            padding: 8px 15px;
            transform: rotate(-10deg); /* เอียงเหมือนตราประทับ */
            letter-spacing: 2px;
            opacity: 0.9;
        }

        /* ข้อมูลนิทรรศการ */
        .info-group {
            margin-top: 10px;
            text-align: left;
            padding: 0 10px;
        }

        .info-label {
            color: #8a7366; /* สีน้ำตาลตุ่น */
            font-size: 0.9em;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .info-value {
            color: #4a3b32; /* สีน้ำตาลเข้ม */
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 12px;
            border-bottom: 1px solid #f0e6e1;
            padding-bottom: 8px;
        }
        
        .info-value:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media only screen and (max-width: 480px) {
            .container { width: 85%; padding: 30px 20px; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังแสงละออง -->
    <div id="stars-container"></div>

    <div class="container">
        <h1>E-TICKET</h1>
        <div class="subtitle">ศรัทธาสุดท้าย นิทรรศการฮีลใจ</div>
        
        <!-- QR Code Section -->
        <div class="qr-wrapper">
            <div id="qrcode"></div>
            <div class="expired-overlay" id="expired-overlay">
                <div class="expired-text">EXPIRED</div>
            </div>
        </div>

        <!-- Ticket Details -->
        <div class="info-group">
            <div class="info-label">Exhibition:</div>
            <div class="info-value" id="exhibition-name">Loading...</div>

            <div class="info-label">Date:</div>
            <div class="info-value" id="exhibition-date">Loading...</div>

            <div class="info-label">Time:</div>
            <div class="info-value" id="exhibition-time-slot">Loading...</div>
        </div>
    </div>

    <script>
        // ฟังก์ชันสร้างละอองแสงอุ่น (Dust Motes)
        function createMotes() {
            const container = document.getElementById('stars-container');
            const moteCount = 25; // จำนวนละอองฝุ่น ไม่ให้รกตากับ QR Code เกินไป
            for (let i = 0; i < moteCount; i++) {
                const mote = document.createElement('div');
                mote.classList.add('mote');
                const size = Math.random() * 4 + 2;
                mote.style.width = `${size}px`;
                mote.style.height = `${size}px`;
                mote.style.left = `${Math.random() * 100}vw`;
                mote.style.top = `${Math.random() * 100}vh`;
                mote.style.animationDuration = `${Math.random() * 4 + 4}s`;
                mote.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(mote);
            }
        }
        window.addEventListener('load', createMotes);
    </script>
</body>
</html>
