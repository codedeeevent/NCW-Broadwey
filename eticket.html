<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-ticket | นิทรรศการฮีลใจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries (เรียงลำดับให้ถูกต้อง Swal2 ต้องมาก่อนไฟล์สคริปต์ของเรา) -->
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script หลัก -->
    <script src="eticket.js"></script>

    <style>
        /* =========================================
           1. ตั้งค่าพื้นฐาน (Mobile Optimized)
           ========================================= */
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4eae4;
            /* Gradient บางๆ ทับรูป เพื่อให้บัตรเด่นขึ้น */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(230, 200, 190, 0.6)), url('bg2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #4a3b32; 
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* =========================================
           2. ด้ายแดงแห่งโชคชะตา (พื้นหลัง)
           ========================================= */
        .red-thread-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .red-thread-bg path {
            fill: none;
            stroke: #d63031;
            stroke-width: 3;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px rgba(214, 48, 49, 0.8));
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            animation: drawThread 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       pulseThread 3s ease-in-out 3.5s infinite alternate;
        }
        .red-thread-bg path:nth-child(2) {
            animation-delay: 1s, 4.5s;
            stroke-width: 2;
            filter: drop-shadow(0 0 8px rgba(214, 48, 49, 0.5));
        }

        @keyframes drawThread { to { stroke-dashoffset: 0; } }
        @keyframes pulseThread {
            0% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(214, 48, 49, 0.4)); }
            100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(214, 48, 49, 1)); }
        }

        /* =========================================
           3. กล่องบัตร E-Ticket (Premium Glassmorphism)
           ========================================= */
        .container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.65) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px 30px 30px;
            border-radius: 24px;
            /* เงาสะท้อนกระจกและเงาสีแดง */
            box-shadow: 0 20px 50px rgba(138, 3, 3, 0.2), 
                        inset 0 0 0 1.5px rgba(255, 255, 255, 0.9),
                        inset 0 20px 20px rgba(255, 255, 255, 0.5);
            width: 92%;
            max-width: 380px;
            text-align: center;
            position: relative;
            z-index: 10;
            
            /* Cinematic Reveal Animation */
            opacity: 0;
            transform: scale(1.1) translateY(30px);
            filter: blur(10px);
            animation: grandReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.3s;
        }

        /* เส้นด้ายแดงตกแต่งด้านบนบัตร */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #d63031, transparent);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 2px 10px rgba(214, 48, 49, 0.5);
        }

        @keyframes grandReveal {
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* =========================================
           4. ส่วนหัวข้อบัตร
           ========================================= */
        h1 {
            margin: 0 0 5px 0;
            background: linear-gradient(to right, #8a0303, #d63031, #8a0303);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 2.2em;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(214, 48, 49, 0.15);
        }
        
        .subtitle {
            color: #b33939;
            font-size: 1.05em;
            margin-bottom: 25px;
            font-weight: 500;
            border-bottom: 2px dashed rgba(214, 48, 49, 0.3); /* รอยฉีกตั๋ว */
            padding-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* =========================================
           5. ส่วน QR Code
           ========================================= */
        .qr-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #fff; 
            border-radius: 18px;
            /* ทำให้ QR ลอยเด่นขึ้นมา */
            box-shadow: 0 10px 30px rgba(138, 3, 3, 0.15), inset 0 0 0 1px #f0e6e1;
        }

        #qrcode {
            display: block;
        }

        /* Overlay หมดอายุ (ตรายางประทับ) */
        .expired-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.85); 
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            z-index: 20;
            backdrop-filter: blur(3px);
        }

        .expired-text {
            color: #d63031;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #d63031;
            border-radius: 8px;
            padding: 8px 18px;
            transform: rotate(-10deg) scale(1.5); 
            letter-spacing: 2px;
            opacity: 0;
            /* อนิเมชันประทับตราปัง! */
            animation: stampStamp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.2s;
        }

        @keyframes stampStamp {
            to { opacity: 0.9; transform: rotate(-10deg) scale(1); box-shadow: 0 0 20px rgba(214, 48, 49, 0.4); }
        }

        /* =========================================
           6. ข้อมูลนิทรรศการบนบัตร
           ========================================= */
        .info-group {
            margin-top: 10px;
            text-align: left;
            padding: 0 15px;
        }

        .info-label {
            color: #8a7366; 
            font-size: 0.9em;
            margin-bottom: 2px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: #4a3b32; 
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(138, 115, 102, 0.2);
            padding-bottom: 8px;
        }
        
        .info-value:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* =========================================
           7. เอฟเฟกต์ 3D ลอยพริ้ว (ละออง & กลีบดอกไม้)
           ========================================= */
        #effect-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .particle {
            position: absolute;
            opacity: 0;
            will-change: transform, opacity;
            animation: floatUp 8s ease-in infinite, sway 3s ease-in-out infinite alternate;
        }
        .particle.orb {
            background: radial-gradient(circle, #fff, rgba(255,220,200,0));
            border-radius: 50%;
        }
        .particle.petal {
            color: rgba(214, 48, 49, 0.7);
            font-size: 14px;
            filter: drop-shadow(0 2px 4px rgba(214,48,49,0.3));
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0.5); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.2); }
        }
        @keyframes sway {
            0% { transform: translateX(-20px) rotate(-15deg); }
            100% { transform: translateX(20px) rotate(15deg); }
        }

        @media only screen and (max-width: 480px) {
            .container { padding: 35px 25px 25px 25px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังด้ายแดงขยับได้ -->
    <svg class="red-thread-bg" preserveAspectRatio="none" viewBox="0 0 100 100">
        <path d="M-10,30 C20,90 80,10 110,70" />
        <path d="M-10,70 C30,-10 70,110 110,20" />
    </svg>

    <!-- พื้นหลังละอองแสงและกลีบดอกไม้ -->
    <div id="effect-container"></div>

    <div class="container">
        <h1>E-TICKET</h1>
        <div class="subtitle">ศรัทธาสุดท้าย นิทรรศการฮีลใจ</div>
        
        <!-- QR Code Section -->
        <div class="qr-wrapper">
            <div id="qrcode"></div>
            <!-- ตรายางประทับกรณีบัตรหมดอายุ -->
            <div class="expired-overlay" id="expired-overlay">
                <div class="expired-text">EXPIRED</div>
            </div>
        </div>

        <!-- Ticket Details -->
        <div class="info-group">
            <div class="info-label">Exhibition:</div>
            <div class="info-value" id="exhibition-name">Loading...</div>

            <div class="info-label">Date:</div>
            <div class="info-value" id="exhibition-date">Loading...</div>

            <div class="info-label">Time:</div>
            <div class="info-value" id="exhibition-time-slot">Loading...</div>
        </div>
    </div>

    <script>
        // ฟังก์ชันสร้างเอฟเฟกต์อลังการ (ละออง & หัวใจ)
        function createParticles() {
            const container = document.getElementById('effect-container');
            
            // สร้างละอองแสง (Orbs)
            for (let i = 0; i < 15; i++) {
                let orb = document.createElement('div');
                orb.className = 'particle orb';
                let size = Math.random() * 6 + 2; 
                orb.style.width = `${size}px`;
                orb.style.height = `${size}px`;
                orb.style.left = `${Math.random() * 100}vw`;
                
                let duration = Math.random() * 6 + 6;
                let delay = Math.random() * 5;
                orb.style.animation = `floatUp ${duration}s ${delay}s linear infinite, sway ${Math.random()*3+2}s ease-in-out infinite alternate`;
                container.appendChild(orb);
            }

            // สร้างกลีบดอกไม้/หัวใจ (Petals)
            for (let i = 0; i < 10; i++) {
                let petal = document.createElement('div');
                petal.className = 'particle petal';
                petal.innerHTML = '❤'; 
                
                let size = Math.random() * 12 + 10; 
                petal.style.fontSize = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                
                let duration = Math.random() * 7 + 7;
                let delay = Math.random() * 5;
                petal.style.animation = `floatUp ${duration}s ${delay}s ease-in infinite, sway ${Math.random()*2+2}s ease-in-out infinite alternate-reverse`;
                container.appendChild(petal);
            }
        }
        
        window.addEventListener('load', createParticles);
    </script>
</body>
</html>
